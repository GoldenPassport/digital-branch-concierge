[project]
name = "concierge"
version = "0.1.0"
description = "Digital branch concierge built with LangGraph and LangChain: governed skills, two deterministic gates and human decisions resumed in LangSmith Studio."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-deepseek>=1.1",
    "langgraph>=1.2,<2",
    "langsmith>=0.12.6",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
